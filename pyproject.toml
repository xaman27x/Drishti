[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drishti-ulpf"
version = "0.4.0"
description = "Lossless, human-governed universal log preprocessing framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Drishti Team" }]
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
production = [
  "aiokafka>=0.12,<1.0",
  "minio>=7.2,<8.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "ocsf-lib==0.10.4",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
drishti-api = "drishti.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/drishti"]

[tool.hatch.build]
include = [
  "src/drishti/**/*.py",
  "src/drishti/ocsf/assets/*.json",
  "src/drishti/ocsf/assets/*.json.gz",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["drishti"]
exclude = ["third_party"]
